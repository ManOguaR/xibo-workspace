name: Build & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Test actual npm package in a clean project
        run: node tests/npm-package.smoke.mjs

      - name: Upload development package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xibo-modules-dev-package
          path: artifacts/*.tgz
          if-no-files-found: error
